<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Forst-Supertrumpf Multiplayer</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Firebase Compat (einfacher für reines HTML) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --forstgrun: #154734;
            --sommergrun: #3e822c;
            --fruhlingsgrun: #91ae2d;
            --schwarz: #2d2a26;
            --karten-bg: #f9faf8;
            --akzent: #d4a017;
            --sieg: #28a745;
            --niederlage: #dc3545;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-image: linear-gradient(#3e822c 22%, #154734 80%);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 5px;
            overflow-x: hidden;
            min-height: 100vh;
            color: white;
        }
        #start-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--forstgrun);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            text-align: center;
            padding: 20px;
        }
        #start-screen img {
            width: 100%;
            max-width: 300px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .start-btn {
            padding: 16px 35px;
            background-color: var(--fruhlingsgrun);
            color: var(--forstgrun);
            border: none;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1.2rem;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 5px 0 #6e8522;
            margin: 8px;
            min-width: 280px;
            transition: transform 0.15s;
        }
        .start-btn:hover { transform: translateY(-2px); }
        .start-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #6e8522; }
        .start-btn.secondary {
            background-color: var(--sommergrun);
            color: white;
            box-shadow: 0 5px 0 #2d5a1e;
        }
        .start-btn.secondary:active { box-shadow: 0 2px 0 #2d5a1e; }
        .mode-selection {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }
        .player-name-input {
            padding: 12px 20px;
            border-radius: 50px;
            border: 2px solid var(--fruhlingsgrun);
            font-size: 1rem;
            text-align: center;
            margin-bottom: 10px;
            width: 280px;
            outline: none;
        }
        #lobby-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
        .lobby-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            text-align: center;
            margin-bottom: 15px;
        }
        .room-code-display {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 8px;
            color: var(--fruhlingsgrun);
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            margin: 10px 0;
        }
        #qrcode {
            margin: 15px auto;
            padding: 15px;
            background: white;
            border-radius: 15px;
            display: inline-block;
        }
        #qrcode img { display: block; margin: 0 auto; }
        .player-list { width: 100%; margin: 15px 0; }
        .player-item {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            background: rgba(255,255,255,0.15);
            border-radius: 10px;
            margin-bottom: 8px;
            gap: 10px;
        }
        .player-avatar {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: var(--fruhlingsgrun);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1rem;
            color: var(--forstgrun);
        }
        .player-name { flex-grow: 1; text-align: left; font-weight: 600; }
        .player-status {
            font-size: 0.75rem;
            padding: 3px 10px;
            border-radius: 12px;
            background: var(--sommergrun);
        }
        .player-status.host { background: var(--akzent); color: var(--schwarz); }
        .share-url {
            font-size: 0.8rem;
            word-break: break-all;
            color: #ccc;
            margin-top: 10px;
            padding: 8px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
        }
        #join-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
        .code-inputs {
            display: flex;
            gap: 8px;
            margin: 15px 0;
        }
        .code-input {
            width: 50px;
            height: 60px;
            font-size: 1.8rem;
            font-weight: bold;
            text-align: center;
            border: 2px solid var(--fruhlingsgrun);
            border-radius: 12px;
            background: rgba(255,255,255,0.9);
            color: var(--forstgrun);
            text-transform: uppercase;
        }
        .code-input:focus {
            outline: none;
            border-color: var(--akzent);
            box-shadow: 0 0 10px rgba(212,160,23,0.3);
        }
        .game-board {
            display: none;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            max-width: 350px;
            margin-top: 5px;
        }
        .deck-info {
            margin: 5px auto 8px auto;
            font-weight: bold;
            color: #fff;
            font-size: 0.75rem;
            text-transform: uppercase;
            padding: 6px 12px;
            border-radius: 6px;
            text-align: center;
        }
        .score-badge {
            background: var(--forstgrun);
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            min-width: 20px;
            text-align: center;
        }
        .score-badge.pop { transform: scale(1.4); }
        .card {
            background-color: var(--karten-bg);
            border-radius: 10px;
            padding: 8px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
            color: var(--schwarz);
        }
        .card.opponent-hidden {
            background: repeating-linear-gradient(45deg, var(--forstgrun), var(--forstgrun) 10px, #1a5a42 10px, #1a5a42 20px);
            height: 83px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--forstgrun);
        }
        .card.opponent-hidden::after {
            content: attr(data-opponent);
            color: white;
            font-weight: bold;
            font-size: 0.9rem;
            border: 1px solid white;
            padding: 8px 16px;
            border-radius: 4px;
            text-align: center;
            background: rgba(0,0,0,0.2);
        }
        .header {
            background-color: var(--forstgrun);
            color: white;
            text-align: center;
            padding: 4px;
            border-radius: 4px;
            margin-bottom: 6px;
        }
        .header h2 { margin: 0; font-size: 15px; text-transform: uppercase; }
        .portrait-container { display: flex; justify-content: center; margin-bottom: 6px; }
        .portrait-circle {
            width: 110px; height: 110px;
            border-radius: 50%;
            border: 2px solid var(--sommergrun);
            background: #fff;
            overflow: hidden;
        }
        .portrait-circle img { width: 100%; height: 100%; object-fit: cover; }
        .stat-row {
            margin-bottom: 3px;
            padding: 6px;
            border-radius: 5px;
            background: white;
            border: 1px solid #eee;
            cursor: pointer;
            transition: background 0.2s;
        }
        .stat-row:hover:not(.disabled) { background: #f0f8e8; }
        .stat-row.disabled { cursor: not-allowed; opacity: 0.6; }
        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: bold;
        }
        .stat-label-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .stat-icon {
            width: 14px;
            height: 14px;
            stroke-width: 2.5;
        }
        .bar-container { background: #eee; height: 4px; border-radius: 2px; margin: 3px 0; }
        .bar-fill { height: 100%; background-color: var(--fruhlingsgrun); }
        .humor-text { font-size: 11px; font-style: italic; color: #666; }
        .winner { background-color: var(--sieg) !important; color: white !important; }
        .loser { background-color: var(--niederlage) !important; color: white !important; }
        .winner .stat-icon, .loser .stat-icon { stroke: white; }
        .winner .humor-text, .loser .humor-text { color: #fff; opacity: 0.9; }
        .controls { margin-top: 10px; width: 100%; max-width: 350px; text-align: center; display: none; }
        .game-button {
            width: 100%;
            padding: 12px;
            background-color: var(--sommergrun);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        .game-button:disabled {
            background-color: #666;
            cursor: not-allowed;
        }
        #next-btn {
            width: 50%;
            max-width: 200px;
            padding: 10px;
            font-size: 14px;
            margin: 15px auto;
            display: none;
        }
        #message {
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 8px;
            min-height: 20px;
        }
        .turn-indicator {
            background: var(--akzent);
            color: var(--schwarz);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 10px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .multiplayer-info {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 350px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 5px;
        }
        .player-chip {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 5px 12px;
            background: rgba(255,255,255,0.15);
            border-radius: 20px;
            font-size: 0.8rem;
        }
        .player-chip.active {
            background: var(--akzent);
            color: var(--schwarz);
            font-weight: bold;
        }
        .player-chip.out { opacity: 0.4; text-decoration: line-through; }
        .portrait-mini { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--sommergrun); overflow: hidden; margin-right: 8px; }
        .portrait-mini img { width: 100%; height: 100%; object-fit: cover; }
        .mini-card-layout { display: flex; align-items: center; margin-top: 5px; }
        .opponents-area {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }
        .opponent-card-wrapper { position: relative; }
        .opponent-label {
            position: absolute;
            top: -8px;
            left: 10px;
            background: var(--forstgrun);
            color: white;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: bold;
            z-index: 2;
        }
        .waiting-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(21, 71, 52, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: var(--fruhlingsgrun);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #game-over-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(21, 71, 52, 0.95);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .podium {
            display: flex;
            align-items: flex-end;
            gap: 15px;
            margin: 20px 0;
        }
        .podium-place {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .podium-bar {
            width: 80px;
            border-radius: 10px 10px 0 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
        }
        .place-1 .podium-bar { height: 120px; background: linear-gradient(to top, #FFD700, #FFA500); }
        .place-2 .podium-bar { height: 90px; background: linear-gradient(to top, #C0C0C0, #A0A0A0); }
        .place-3 .podium-bar { height: 70px; background: linear-gradient(to top, #CD7F32, #B87333); }
        .podium-name {
            margin-top: 8px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        @media (min-width: 768px) {
            .game-board { max-width: 700px; flex-direction: row; align-items: flex-start; margin-top: 20px; gap: 20px; }
            .card { width: 300px; }
            .opponents-area { max-width: 300px; }
        }
    </style>
</head>
<body>

<div id="start-screen">
    <img src="cover.png" alt="Forst-Supertrumpf Cover" onerror="this.src='https://via.placeholder.com/400x300?text=Forst-Supertrumpf'">
    <h1 style="margin:0 0 5px 0; font-size:1.8rem;">Forst-Supertrumpf</h1>
    <p style="margin:0 0 20px 0; opacity:0.8;">Das ultimative Forst-Quartett</p>
    <input type="text" id="player-name" class="player-name-input" placeholder="Dein Name" maxlength="15" value="">
    <div class="mode-selection">
        <button class="start-btn" onclick="selectMode('cpu')">🎮 Gegen CPU spielen</button>
        <button class="start-btn secondary" onclick="showCreateRoom()">🏠 Raum erstellen</button>
        <button class="start-btn secondary" onclick="showJoinRoom()">🔗 Raum beitreten</button>
    </div>
</div>

<div id="lobby-screen">
    <div class="lobby-card">
        <h2 style="margin:0 0 10px 0;">🏠 Dein Spielraum</h2>
        <div style="font-size:0.9rem; opacity:0.8; margin-bottom:5px;">Raum-Code:</div>
        <div class="room-code-display" id="room-code-display">----</div>
        <div id="qrcode"></div>
        <div class="share-url" id="share-url"></div>
    </div>
    <div class="lobby-card">
        <h3 style="margin:0 0 15px 0;">👥 Spieler (<span id="player-count">1</span>/4)</h3>
        <div class="player-list" id="lobby-player-list"></div>
    </div>
    <button class="start-btn" id="start-mp-btn" onclick="startMultiplayerGame()" style="min-width:200px;">🚀 Spiel starten</button>
    <button class="start-btn secondary" onclick="leaveRoom()" style="min-width:200px; margin-top:10px;">❌ Abbrechen</button>
</div>

<div id="join-screen">
    <div class="lobby-card">
        <h2 style="margin:0 0 10px 0;">🔗 Raum beitreten</h2>
        <p style="font-size:0.9rem; opacity:0.8;">Gib den 4-stelligen Code ein:</p>
        <div class="code-inputs">
            <input type="text" class="code-input" maxlength="1" id="code-1" oninput="moveCodeInput(1)" onkeydown="moveCodeBack(1)">
            <input type="text" class="code-input" maxlength="1" id="code-2" oninput="moveCodeInput(2)" onkeydown="moveCodeBack(2)">
            <input type="text" class="code-input" maxlength="1" id="code-3" oninput="moveCodeInput(3)" onkeydown="moveCodeBack(3)">
            <input type="text" class="code-input" maxlength="1" id="code-4" oninput="moveCodeInput(4)" onkeydown="moveCodeBack(4)">
        </div>
        <button class="start-btn" onclick="joinRoom()" style="min-width:200px;">Beitreten</button>
    </div>
    <button class="start-btn secondary" onclick="backToStart()" style="min-width:200px; margin-top:10px;">← Zurück</button>
</div>

<div class="waiting-overlay" id="waiting-overlay">
    <div class="spinner"></div>
    <h2 id="waiting-text">Warte auf Spieler...</h2>
    <p id="waiting-sub">Die anderen Spieler müssen noch ihren Zug machen</p>
</div>

<div id="game-over-screen">
    <h1>🏆 Spiel beendet!</h1>
    <div class="podium" id="podium"></div>
    <div id="final-ranking"></div>
    <button class="start-btn" onclick="backToStart()" style="margin-top:20px;">Neues Spiel</button>
</div>

<div class="game-board" id="game-board">
    <div class="opponents-area" id="opponents-area"></div>
    <div id="player-area">
        <div class="deck-info">
            <span>Deine Karten:</span>
            <span class="score-badge" id="p-count">--</span>
        </div>
        <div id="player-card-container"></div>
    </div>
</div>

<div class="controls" id="game-controls">
    <div class="multiplayer-info" id="multiplayer-info"></div>
    <div class="turn-indicator" id="turn-indicator" style="display:none;">🎯 Du bist dran!</div>
    <div id="message">↑ Wähle einen Wert ↑</div>
    <button id="next-btn" class="game-button" style="display:none;" onclick="nextRound()">Nächste Runde</button>
</div>

// ===== STATE =====
let gameMode = 'cpu';
let myPlayerId = null;
let myPlayerName = '';
let roomCode = null;
let roomRef = null;
let gameState = null;
let localPlayerDeck = [];
let canPlay = true;
let isMyTurn = false;
let roundResult = null;
let playerDeck = [];
let cpuDeck = [];

// ===== UTILS =====
function generateRoomCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = '';
    for (let i = 0; i < 4; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
    return code;
}

function getPlayerName() {
    const name = document.getElementById('player-name').value.trim();
    return name || 'Spieler ' + Math.floor(Math.random() * 999);
}

function showScreen(id) {
    ['start-screen', 'lobby-screen', 'join-screen', 'game-board', 'game-controls', 'game-over-screen'].forEach(s => {
        const el = document.getElementById(s);
        if (el) el.style.display = 'none';
    });
    const target = document.getElementById(id);
    if (target) {
        if (id === 'game-board') target.style.display = 'flex';
        else target.style.display = 'flex';
    }
    if (id === 'game-board' || id === 'game-controls') {
        document.getElementById('game-controls').style.display = 'block';
    }
}

// ===== NAVIGATION =====
function selectMode(mode) {
    gameMode = mode;
    myPlayerName = getPlayerName();
    if (mode === 'cpu') {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('game-board').style.display = 'flex';
        document.getElementById('game-controls').style.display = 'block';
        document.getElementById('opponents-area').innerHTML = '<div id="cpu-side"><div id="cpu-card-container"></div></div>';
        initGame();
    }
}

function showCreateRoom() {
    myPlayerName = getPlayerName();
    if (!db) {
        alert('Firebase ist nicht korrekt konfiguriert. Bitte prüfe die Daten in der HTML-Datei.');
        return;
    }
    roomCode = generateRoomCode();
    myPlayerId = 'player_' + Date.now() + '_' + Math.floor(Math.random() * 1000);

    roomRef = db.ref('rooms/' + roomCode);

    const roomData = {
        created: Date.now(),
        status: 'waiting',
        host: myPlayerId,
        players: {
            [myPlayerId]: {
                name: myPlayerName,
                isHost: true,
                joined: Date.now(),
                cards: [],
                cardCount: 0,
                active: true
            }
        },
        game: null
    };

    roomRef.set(roomData).then(() => {
        document.getElementById('room-code-display').textContent = roomCode;
        const shareUrl = window.location.href.split('?')[0] + '?room=' + roomCode;
        document.getElementById('share-url').textContent = shareUrl;

        // QR Code
        document.getElementById('qrcode').innerHTML = '';
        new QRCode(document.getElementById('qrcode'), {
            text: shareUrl,
            width: 150,
            height: 150,
            colorDark: '#154734',
            colorLight: '#ffffff'
        });

        showScreen('lobby-screen');
        listenToRoom();
    }).catch(err => {
        console.error('Fehler beim Erstellen des Raums:', err);
        alert('Fehler beim Erstellen des Raums: ' + err.message);
    });
}

function showJoinRoom() {
    myPlayerName = getPlayerName();
    if (!db) {
        alert('Firebase ist nicht korrekt konfiguriert.');
        return;
    }
    // Prüfe URL-Parameter für Raum-Code
    const urlParams = new URLSearchParams(window.location.search);
    const roomFromUrl = urlParams.get('room');
    if (roomFromUrl) {
        document.getElementById('code-1').value = roomFromUrl[0] || '';
        document.getElementById('code-2').value = roomFromUrl[1] || '';
        document.getElementById('code-3').value = roomFromUrl[2] || '';
        document.getElementById('code-4').value = roomFromUrl[3] || '';
    }
    showScreen('join-screen');
}

function moveCodeInput(n) {
    const val = document.getElementById('code-' + n).value.toUpperCase();
    document.getElementById('code-' + n).value = val;
    if (val && n < 4) {
        document.getElementById('code-' + (n + 1)).focus();
    }
}

function moveCodeBack(n) {
    if (event.key === 'Backspace' && !document.getElementById('code-' + n).value && n > 1) {
        document.getElementById('code-' + (n - 1)).focus();
    }
}

function joinRoom() {
    const code = [
        document.getElementById('code-1').value,
        document.getElementById('code-2').value,
        document.getElementById('code-3').value,
        document.getElementById('code-4').value
    ].join('').toUpperCase();

    if (code.length !== 4) {
        alert('Bitte gib einen vollständigen 4-stelligen Code ein.');
        return;
    }

    roomCode = code;
    myPlayerId = 'player_' + Date.now() + '_' + Math.floor(Math.random() * 1000);

    roomRef = db.ref('rooms/' + roomCode);

    roomRef.once('value').then(snapshot => {
        const room = snapshot.val();
        if (!room) {
            alert('Raum nicht gefunden. Prüfe den Code.');
            return;
        }
        if (room.status !== 'waiting') {
            alert('Das Spiel läuft bereits oder der Raum ist geschlossen.');
            return;
        }
        const playerCount = Object.keys(room.players || {}).length;
        if (playerCount >= 4) {
            alert('Der Raum ist voll (max. 4 Spieler).');
            return;
        }

        return roomRef.child('players/' + myPlayerId).set({
            name: myPlayerName,
            isHost: false,
            joined: Date.now(),
            cards: [],
            cardCount: 0,
            active: true
        });
    }).then(() => {
        gameMode = 'client';
        showScreen('lobby-screen');
        document.getElementById('room-code-display').textContent = roomCode;
        document.getElementById('qrcode').style.display = 'none';
        document.getElementById('share-url').style.display = 'none';
        document.getElementById('start-mp-btn').style.display = 'none';
        listenToRoom();
    }).catch(err => {
        console.error('Fehler beim Beitreten:', err);
        alert('Fehler beim Beitreten zum Raum: ' + err.message);
    });
}

function listenToRoom() {
    if (!roomRef) return;

    roomRef.on('value', snapshot => {
        const room = snapshot.val();
        if (!room) return;

        // Update Spieler-Liste
        const playerList = document.getElementById('lobby-player-list');
        playerList.innerHTML = '';
        const players = room.players || {};
        const playerIds = Object.keys(players);
        document.getElementById('player-count').textContent = playerIds.length;

        playerIds.forEach(pid => {
            const p = players[pid];
            const div = document.createElement('div');
            div.className = 'player-item';
            div.innerHTML = `
                <div class="player-avatar">${p.name.charAt(0).toUpperCase()}</div>
                <div class="player-name">${p.name}</div>
                <div class="player-status ${p.isHost ? 'host' : ''}">${p.isHost ? 'Host' : 'Spieler'}</div>
            `;
            playerList.appendChild(div);
        });

        // Spiel gestartet?
        if (room.status === 'playing' && room.game) {
            gameState = room.game;
            startLocalMultiplayerGame(room);
        }

        // Spiel läuft - update
        if (room.status === 'playing' && gameState) {
            updateMultiplayerGame(room);
        }

        // Spiel beendet
        if (room.status === 'finished') {
            showGameOver(room);
        }
    });
}

function leaveRoom() {
    if (roomRef && myPlayerId) {
        roomRef.child('players/' + myPlayerId).remove();
        roomRef.off();
    }
    roomRef = null;
    roomCode = null;
    myPlayerId = null;
    backToStart();
}

function backToStart() {
    if (roomRef) {
        roomRef.off();
        roomRef = null;
    }
    roomCode = null;
    myPlayerId = null;
    gameState = null;
    localPlayerDeck = [];

    // Reset UI
    document.getElementById('start-screen').style.display = 'flex';
    document.getElementById('lobby-screen').style.display = 'none';
    document.getElementById('join-screen').style.display = 'none';
    document.getElementById('game-board').style.display = 'none';
    document.getElementById('game-controls').style.display = 'none';
    document.getElementById('game-over-screen').style.display = 'none';
    document.getElementById('waiting-overlay').style.display = 'none';
    document.getElementById('opponents-area').innerHTML = '';
    document.getElementById('player-card-container').innerHTML = '';
    document.getElementById('qrcode').style.display = 'block';
    document.getElementById('share-url').style.display = 'block';
    document.getElementById('start-mp-btn').style.display = 'block';

    // Reset code inputs
    for (let i = 1; i <= 4; i++) {
        document.getElementById('code-' + i).value = '';
    }

    // Clear URL params
    window.history.replaceState({}, document.title, window.location.pathname);
}

// ===== MULTIPLAYER GAME START =====
function startMultiplayerGame() {
    if (!roomRef) return;

    roomRef.once('value').then(snapshot => {
        const room = snapshot.val();
        const players = room.players || {};
        const playerIds = Object.keys(players);

        if (playerIds.length < 2) {
            alert('Mindestens 2 Spieler nötig!');
            return;
        }

        // Mische Karten und teile aus
        let cards = [...mitarbeiterDaten];
        cards.sort(() => Math.random() - 0.5);

        const cardsPerPlayer = Math.floor(cards.length / playerIds.length);
        const gameData = {
            status: 'playing',
            currentPlayer: playerIds[0],
            round: 1,
            lastMove: null,
            winner: null,
            playerCards: {},
            eliminated: [],
            pot: []
        };

        playerIds.forEach((pid, index) => {
            const start = index * cardsPerPlayer;
            const end = start + cardsPerPlayer;
            const playerCards = cards.slice(start, end);
            gameData.playerCards[pid] = playerCards.map(c => c.titel);
        });

        // Restliche Karten zum Pot
        const dealt = playerIds.length * cardsPerPlayer;
        if (dealt < cards.length) {
            gameData.pot = cards.slice(dealt).map(c => c.titel);
        }

        return roomRef.update({
            status: 'playing',
            game: gameData
        });
    });
}

function startLocalMultiplayerGame(room) {
    document.getElementById('lobby-screen').style.display = 'none';
    document.getElementById('game-board').style.display = 'flex';
    document.getElementById('game-controls').style.display = 'block';

    updateMultiplayerGame(room);
}

function updateMultiplayerGame(room) {
    if (!room || !room.game) return;

    const game = room.game;
    const players = room.players || {};
    const myCards = game.playerCards[myPlayerId] || [];

    // Lade meine Karten
    localPlayerDeck = myCards.map(titel => mitarbeiterDaten.find(c => c.titel === titel)).filter(c => c);

    // Prüfe ob ich dran bin
    isMyTurn = game.currentPlayer === myPlayerId;

    // Zeige Gegner
    const opponentsArea = document.getElementById('opponents-area');
    opponentsArea.innerHTML = '';

    Object.keys(players).forEach(pid => {
        if (pid === myPlayerId) return;
        const p = players[pid];
        const pCards = game.playerCards[pid] || [];
        const isActive = !game.eliminated || !game.eliminated.includes(pid);

        const wrapper = document.createElement('div');
        wrapper.className = 'opponent-card-wrapper';
        wrapper.innerHTML = `
            <div class="opponent-label">${p.name} (${pCards.length})</div>
            <div class="card opponent-hidden" data-opponent="${p.name}: ${pCards.length} Karten" 
                 style="${!isActive ? 'opacity:0.4;' : ''}"></div>
        `;
        opponentsArea.appendChild(wrapper);
    });

    // Update Multiplayer-Info
    const infoArea = document.getElementById('multiplayer-info');
    infoArea.innerHTML = '';
    Object.keys(players).forEach(pid => {
        const p = players[pid];
        const pCards = game.playerCards[pid] || [];
        const isActive = !game.eliminated || !game.eliminated.includes(pid);
        const chip = document.createElement('div');
        chip.className = 'player-chip' + (pid === game.currentPlayer ? ' active' : '') + (!isActive ? ' out' : '');
        chip.innerHTML = `<span>${p.name}</span><span>${pCards.length}</span>`;
        infoArea.appendChild(chip);
    });

    // Zeige meine Karte
    document.getElementById('p-count').textContent = localPlayerDeck.length;

    if (localPlayerDeck.length > 0) {
        const disabled = !isMyTurn || game.lastMove;
        document.getElementById('player-card-container').innerHTML = createCardHTML(localPlayerDeck[0], false, null, disabled);
    } else {
        document.getElementById('player-card-container').innerHTML = '<div style="text-align:center;padding:20px;"><h3>Du hast keine Karten mehr!</h3></div>';
    }

    // Turn indicator
    const turnInd = document.getElementById('turn-indicator');
    if (isMyTurn && !game.lastMove) {
        turnInd.style.display = 'block';
        turnInd.textContent = '🎯 Du bist dran! Wähle einen Wert!';
        document.getElementById('message').textContent = '↑ Wähle einen Wert ↑';
    } else if (game.lastMove) {
        turnInd.style.display = 'none';
        const lastMove = game.lastMove;
        const mover = players[lastMove.playerId];
        document.getElementById('message').textContent = `${mover ? mover.name : 'Spieler'} wählte: ${lastMove.statLabel} (${lastMove.statValue}%)`;
    } else {
        turnInd.style.display = 'block';
        const currentP = players[game.currentPlayer];
        turnInd.textContent = `⏳ ${currentP ? currentP.name : 'Spieler'} ist dran...`;
        document.getElementById('message').textContent = 'Warte auf den anderen Spieler...';
    }

    // Warte-Overlay
    const waitingOverlay = document.getElementById('waiting-overlay');
    if (!isMyTurn && !game.lastMove) {
        waitingOverlay.style.display = 'flex';
        document.getElementById('waiting-text').textContent = 'Warte auf ' + (players[game.currentPlayer] ? players[game.currentPlayer].name : 'Spieler') + '...';
    } else {
        waitingOverlay.style.display = 'none';
    }

    // Next button wenn Runde ausgewertet
    const nextBtn = document.getElementById('next-btn');
    if (game.lastMove && isMyTurn && game.lastMove.evaluated) {
        nextBtn.style.display = 'block';
        nextBtn.textContent = 'Nächste Runde';
        showRoundResult(game, players);
    } else {
        nextBtn.style.display = 'none';
    }

    lucide.createIcons();
}

function showRoundResult(game, players) {
    const lastMove = game.lastMove;
    if (!lastMove) return;

    const myCard = localPlayerDeck[0];
    if (!myCard) return;

    const statIndex = myCard.stats.findIndex(s => s.l === lastMove.statLabel);
    if (statIndex === -1) return;

    const myValue = myCard.stats[statIndex].v;
    const pRows = document.querySelectorAll('#player-area .stat-row');

    if (lastMove.playerId === myPlayerId) {
        if (lastMove.winner === myPlayerId) {
            if (pRows[statIndex]) pRows[statIndex].classList.add('winner');
            document.getElementById('message').textContent = '🎉 Du gewinnst den Stich!';
        } else if (lastMove.winner) {
            if (pRows[statIndex]) pRows[statIndex].classList.add('loser');
            const winner = players[lastMove.winner];
            document.getElementById('message').textContent = `😞 ${winner ? winner.name : 'Gegner'} gewinnt mit ${lastMove.bestValue}%`;
        } else {
            document.getElementById('message').textContent = '🤝 Gleichstand!';
        }
    } else {
        const theirValue = lastMove.statValue;
        if (myValue > theirValue) {
            if (pRows[statIndex]) pRows[statIndex].classList.add('winner');
            document.getElementById('message').textContent = '🎉 Du gewinnst mit ' + myValue + '%!';
        } else if (theirValue > myValue) {
            if (pRows[statIndex]) pRows[statIndex].classList.add('loser');
            document.getElementById('message').textContent = `😞 Du verlierst: ${myValue}% vs ${theirValue}%`;
        } else {
            document.getElementById('message').textContent = '🤝 Gleichstand: ' + myValue + '%!';
        }
    }
}

function playTurnMP(statIndex) {
    if (!isMyTurn || !roomRef || !gameState) return;

    const myCard = localPlayerDeck[0];
    if (!myCard) return;

    const stat = myCard.stats[statIndex];

    // Sende Zug an Firebase
    roomRef.child('game/lastMove').set({
        playerId: myPlayerId,
        statLabel: stat.l,
        statValue: stat.v,
        timestamp: Date.now(),
        evaluated: false
    }).then(() => {
        // Warte kurz, dann werte aus
        setTimeout(() => evaluateRound(), 1000);
    });
}

function evaluateRound() {
    if (!roomRef || !gameState) return;

    roomRef.once('value').then(snapshot => {
        const room = snapshot.val();
        const game = room.game;
        if (!game || !game.lastMove || game.lastMove.evaluated) return;

        const playerIds = Object.keys(room.players || {});
        const isEvaluator = game.host === myPlayerId || playerIds[0] === myPlayerId;

        if (!isEvaluator) return;

        const lastMove = game.lastMove;
        const allCards = {};
        let bestValue = -1;
        let winner = null;
        let isTie = false;

        playerIds.forEach(pid => {
            if (game.eliminated && game.eliminated.includes(pid)) return;
            const cards = game.playerCards[pid] || [];
            if (cards.length === 0) return;

            const cardData = mitarbeiterDaten.find(c => c.titel === cards[0]);
            if (!cardData) return;

            const stat = cardData.stats.find(s => s.l === lastMove.statLabel);
            if (!stat) return;

            allCards[pid] = { value: stat.v, card: cards[0] };

            if (stat.v > bestValue) {
                bestValue = stat.v;
                winner = pid;
                isTie = false;
            } else if (stat.v === bestValue) {
                isTie = true;
            }
        });

        const updates = {};

        if (isTie) {
            playerIds.forEach(pid => {
                if (game.eliminated && game.eliminated.includes(pid)) return;
                const cards = game.playerCards[pid] || [];
                if (cards.length > 0) {
                    updates['game/playerCards/' + pid] = cards.slice(1);
                }
            });
            const pot = game.pot || [];
            const newPot = [...pot];
            playerIds.forEach(pid => {
                if (allCards[pid]) newPot.push(allCards[pid].card);
            });
            updates['game/pot'] = newPot;
            updates['game/lastMove/winner'] = null;
            updates['game/lastMove/bestValue'] = bestValue;
            updates['game/lastMove/evaluated'] = true;
        } else {
            const winnerCards = game.playerCards[winner] || [];
            const newWinnerCards = [...winnerCards.slice(1)];

            playerIds.forEach(pid => {
                if (game.eliminated && game.eliminated.includes(pid)) return;
                const cards = game.playerCards[pid] || [];
                if (cards.length > 0 && pid !== winner) {
                    newWinnerCards.push(cards[0]);
                    updates['game/playerCards/' + pid] = cards.slice(1);
                }
            });

            const pot = game.pot || [];
            pot.forEach(c => newWinnerCards.push(c));

            updates['game/playerCards/' + winner] = newWinnerCards;
            updates['game/pot'] = [];
            updates['game/lastMove/winner'] = winner;
            updates['game/lastMove/bestValue'] = bestValue;
            updates['game/lastMove/evaluated'] = true;
            updates['game/currentPlayer'] = winner;
        }

        const newEliminated = [...(game.eliminated || [])];
        playerIds.forEach(pid => {
            const cards = game.playerCards[pid] || [];
            const afterMove = updates['game/playerCards/' + pid];
            const remaining = afterMove ? afterMove.length : cards.length;
            if (remaining === 0 && !newEliminated.includes(pid)) {
                newEliminated.push(pid);
            }
        });
        updates['game/eliminated'] = newEliminated;

        const activePlayers = playerIds.filter(pid => !newEliminated.includes(pid));
        if (activePlayers.length <= 1) {
            updates['status'] = 'finished';
            updates['game/winner'] = activePlayers[0] || winner;
        }

        updates['game/round'] = (game.round || 1) + 1;

        return roomRef.update(updates);
    });
}

function nextRound() {
    if (!roomRef || !gameState) return;

    roomRef.child('game/lastMove').remove().then(() => {
        // Nächster Spieler falls nötig
        if (gameState.lastMove && gameState.lastMove.winner) {
            // Gewinner bleibt dran
        }
    });
}

function showGameOver(room) {
    document.getElementById('game-board').style.display = 'none';
    document.getElementById('game-controls').style.display = 'none';
    document.getElementById('waiting-overlay').style.display = 'none';
    document.getElementById('game-over-screen').style.display = 'flex';

    const game = room.game;
    const players = room.players || {};

    const ranking = Object.keys(players)
        .map(pid => ({
            id: pid,
            name: players[pid].name,
            cards: (game.playerCards[pid] || []).length
        }))
        .sort((a, b) => b.cards - a.cards);

    const podium = document.getElementById('podium');
    podium.innerHTML = '';

    const places = [
        ranking[1] || null,
        ranking[0] || null,
        ranking[2] || null
    ];

    places.forEach((p, i) => {
        if (!p) return;
        const placeDiv = document.createElement('div');
        placeDiv.className = 'podium-place place-' + (i === 0 ? 2 : i === 1 ? 1 : 3);
        placeDiv.innerHTML = `
            <div class="podium-bar">${i === 0 ? '2' : i === 1 ? '1' : '3'}</div>
            <div class="podium-name">${p.name}</div>
            <div style="font-size:0.75rem;opacity:0.8;">${p.cards} Karten</div>
        `;
        podium.appendChild(placeDiv);
    });

    const restDiv = document.getElementById('final-ranking');
    restDiv.innerHTML = '<h3>Rangliste</h3>';
    ranking.forEach((p, i) => {
        const div = document.createElement('div');
        div.style.cssText = 'padding:8px; margin:4px 0; background:rgba(255,255,255,0.1); border-radius:8px;';
        div.innerHTML = `<strong>#${i+1}</strong> ${p.name} — ${p.cards} Karten`;
        restDiv.appendChild(div);
    });
}

// ===== CPU MODE (Original) =====
function initGame() {
    let cards = [...mitarbeiterDaten];
    cards.sort(() => Math.random() - 0.5);
    playerDeck = cards.slice(0, Math.floor(cards.length / 2));
    cpuDeck = cards.slice(Math.floor(cards.length / 2));
    renderCPU();
}

function createCardHTML(data, isCpuHidden, filterIndex, disabled) {
    if (isCpuHidden) {
        const count = gameMode === 'cpu' ? cpuDeck.length : 0;
        return `<div class="card opponent-hidden" data-opponent="Gegner hat: ${count} Karten"></div>`;
    }
    if (!data) return '';

    const renderStat = (s, i, isMini) => {
        const iconName = iconMap[s.l] || "circle";
        const clickAttr = (!isMini && !disabled) ? `onclick="playTurn(${i})"` : '';
        const disabledClass = disabled ? 'disabled' : '';
        return `
            <div class="stat-row ${disabledClass}" ${clickAttr}>
                <div class="stat-header">
                    <div class="stat-label-group">
                        <i data-lucide="${iconName}" class="stat-icon"></i>
                        <span>${s.l}</span>
                    </div>
                    <span>${s.v}%</span>
                </div>
                <div class="bar-container"><div class="bar-fill" style="width:${s.v}%"></div></div>
                <div class="humor-text">${s.t}</div>
            </div>
        `;
    };

    if (filterIndex !== null) {
        return `
            <div class="card">
                <div class="header"><h2>${data.titel}</h2></div>
                <div class="mini-card-layout">
                    <div class="portrait-mini"><img src="${data.bildUrl}" onerror="this.src='https://via.placeholder.com/50'"></div>
                    <div style="flex-grow:1">${renderStat(data.stats[filterIndex], 0, true)}</div>
                </div>
            </div>`;
    }

    const statsHTML = data.stats.map((s, i) => renderStat(s, i, false)).join('');

    return `
        <div class="card">
            <div class="header"><h2>${data.titel}</h2></div>
            <div class="portrait-container"><div class="portrait-circle"><img src="${data.bildUrl}" onerror="this.src='https://via.placeholder.com/100'"></div></div>
            <div class="stats-area">${statsHTML}</div>
        </div>`;
}

function playTurn(statIndex) {
    if (gameMode !== 'cpu') {
        playTurnMP(statIndex);
        return;
    }

    if (!canPlay) return;
    canPlay = false;

    const pCard = playerDeck[0];
    const cCard = cpuDeck[0];
    const pVal = pCard.stats[statIndex].v;
    const cVal = cCard.stats[statIndex].v;

    document.getElementById('cpu-card-container').innerHTML = createCardHTML(cCard, false, statIndex);

    const pRows = document.querySelectorAll('#player-area .stat-row');
    const cRows = document.querySelectorAll('#cpu-side .stat-row');
    const msgEl = document.getElementById('message');

    if (pVal > cVal) {
        msgEl.textContent = "Stich gewonnen!";
        pRows[statIndex].classList.add('winner');
        if(cRows[0]) cRows[0].classList.add('loser');
        playerDeck.push(playerDeck.shift(), cpuDeck.shift());
    } else if (cVal > pVal) {
        msgEl.textContent = "Stich verloren!";
        pRows[statIndex].classList.add('loser');
        if(cRows[0]) cRows[0].classList.add('winner');
        cpuDeck.push(cpuDeck.shift(), playerDeck.shift());
    } else {
        msgEl.textContent = "Gleichstand!";
        playerDeck.push(playerDeck.shift());
        cpuDeck.push(cpuDeck.shift());
    }

    lucide.createIcons();
    document.getElementById('next-btn').style.display = "block";
    updateCountsCPU();
}

function nextRound() {
    if (gameMode !== 'cpu') {
        nextRoundMP();
        return;
    }

    if (playerDeck.length === 0 || cpuDeck.length === 0) {
        alert(playerDeck.length === 0 ? "Game Over!" : "Gewonnen!");
        location.reload();
        return;
    }
    canPlay = true;
    document.getElementById('next-btn').style.display = "none";
    document.getElementById('message').textContent = "↑ Wähle einen Wert ↑";
    renderCPU();
}

function updateCountsCPU() {
    const pBadge = document.getElementById('p-count');
    pBadge.classList.add('pop');
    pBadge.textContent = playerDeck.length;
    setTimeout(() => { pBadge.classList.remove('pop'); }, 200);
}

function renderCPU() {
    document.getElementById('player-card-container').innerHTML = createCardHTML(playerDeck[0], false, null, false);
    document.getElementById('cpu-card-container').innerHTML = createCardHTML(null, true);
    document.getElementById('p-count').innerText = playerDeck.length;
    lucide.createIcons();
}

function nextRoundMP() {
    if (!roomRef || !gameState) return;

    roomRef.child('game/lastMove').remove();
}

// ===== INIT =====
window.addEventListener('load', () => {
    lucide.createIcons();

    // Prüfe URL-Parameter
    const urlParams = new URLSearchParams(window.location.search);
    const roomFromUrl = urlParams.get('room');
    if (roomFromUrl) {
        document.getElementById('code-1').value = roomFromUrl[0] || '';
        document.getElementById('code-2').value = roomFromUrl[1] || '';
        document.getElementById('code-3').value = roomFromUrl[2] || '';
        document.getElementById('code-4').value = roomFromUrl[3] || '';
        showJoinRoom();
    }
});
